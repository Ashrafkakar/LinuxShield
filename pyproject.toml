[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linuxshield-audit"
version = "0.1.0"
description = "A safe, read-only Linux security auditing starter tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LinuxShield Contributors"}]
dependencies = []

[project.scripts]
linuxshield = "linuxshield.cli:main"

[tool.setuptools.packages.find]
include = ["linuxshield*"]
